<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111f">
<title>ADA (अदा)</title>

<style>
:root {
  --bg:#14111f;
  --card:#201a33;
  --me:#5b3fd1;
  --ada:#2a2342;
  --text:#f2eefc;
  --mute:#9d94bd;
}
* {box-sizing:border-box}
html,body {
  margin:0;height:100%;
  background:var(--bg);color:var(--text);
  font-family:system-ui,sans-serif;
}
#app {
  display:flex;flex-direction:column;
  height:100dvh;max-width:600px;margin:auto;
}
header {
  display:flex;align-items:center;
  justify-content:space-between;
  padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top));
}
header h1 {font-size:19px;margin:0}
#status {font-size:12px;color:var(--mute)}
.hbtn {
  background:none;border:1px solid #3a3160;
  color:var(--text);border-radius:10px;
  padding:7px 10px;font-size:13px;
}
#chat {
  flex:1;overflow-y:auto;padding:10px 14px;
}
.m {
  max-width:85%;padding:11px 13px;
  border-radius:14px;margin:7px 0;
  line-height:1.5;white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.me {
  background:var(--me);margin-left:auto;
  border-bottom-right-radius:4px;
}
.ada {
  background:var(--ada);
  border-bottom-left-radius:4px;
}
#bar {
  display:flex;gap:8px;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:var(--card);
}
#inp {
  flex:1;min-width:0;background:var(--bg);
  color:var(--text);border:1px solid #3a3160;
  border-radius:12px;padding:12px;font-size:16px;
}
.btn {
  border:none;border-radius:12px;
  padding:0 15px;font-size:15px;
  color:white;background:var(--me);
}
#mic {background:#c2418a;min-width:48px}
#mic.on {background:#e5484d}
button:disabled {opacity:.5}
#setup {
  position:fixed;inset:0;background:var(--bg);
  display:none;flex-direction:column;
  justify-content:center;padding:24px;
  gap:12px;z-index:5;
}
#setup input {
  background:var(--card);color:var(--text);
  border:1px solid #3a3160;
  border-radius:12px;padding:13px;font-size:16px;
}
#setup p {color:var(--mute);font-size:13px}
</style>
</head>

<body>
<div id="app">

<header>
  <div>
    <h1>ADA (अदा)</h1>
    <div id="status">Ready</div>
  </div>
  <div style="display:flex;gap:6px">
    <button class="hbtn" id="voiceBtn">🔊 On</button>
    <button class="hbtn" id="menuBtn">⚙️</button>
  </div>
</header>

<div id="chat"></div>

<div id="bar">
  <button class="btn" id="mic">🎤</button>
  <input id="inp" placeholder="ADA se baat karo..." autocomplete="off">
  <button class="btn" id="send">Bhejo</button>
</div>

</div>

<div id="setup">
  <h2>ADA Setup</h2>
  <p>Apni Gemini API Key enter karein. Key isi browser ke local storage mein save hogi. Ise kisi ke saath share na karein.</p>
  <input id="keyInp" type="password" placeholder="Gemini API Key" autocomplete="off">
  <button class="btn" style="padding:13px" id="saveKey">Save Key</button>
  <button class="hbtn" id="memClear">Clear Memory</button>
  <button class="hbtn" id="chatClear">Clear Chat History</button>
  <button class="hbtn" id="closeSetup">Close</button>
</div>

<script>
"use strict";

// -------- CONFIGURATION --------

// Pehla model fail ho toh doosra try hoga
const MODELS = ["gemini-3.8-flash", "gemini-flash-latest"];
const MAX_TRIES = 4;
const TIMEOUT_MS = 30000;
const RETRY_STATUS = [404, 429, 500, 502, 503, 504];

const PERSONALITY = `
You are ADA (अदा), a friendly, intelligent and expressive female AI companion.

Speak mainly in Hinglish (Roman Hindi and English).
If the user speaks Hindi, reply in Hindi.
If the user speaks English, reply in English.

Be respectful, natural and helpful.
Keep answers short, usually 2-4 sentences.
Give detailed answers when requested.
Do not use emoji or markdown symbols, because your reply is spoken aloud.

Your name is always ADA.
Do not pretend to control the phone when you cannot.

When the user shares an important long-term preference or fact,
you may add this at the end:
[REMEMBER: short fact]

Do not use this tag for ordinary conversation.
`;

// -------- STORAGE --------

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const chat = $("chat");
const inp = $("inp");
const statusEl = $("status");

let busy = false;
let listening = false;
let speakOn = true;

function getKey() {
  return localStorage.getItem("ada_key") || "";
}

function getMem() {
  return localStorage.getItem("ada_mem") || "";
}

function saveHistory() {
  try {
    localStorage.setItem("ada_history", JSON.stringify(history.slice(-40)));
  } catch(e) {
    console.warn("History could not be saved", e);
  }
}

let history = [];

try {
  const saved = JSON.parse(
    localStorage.getItem("ada_history") || "[]"
  );

  if (Array.isArray(saved)) {
    history = saved.filter(m =>
      (m.role === "user" || m.role === "model") &&
      typeof m.text === "string"
    ).slice(-40);
  }
} catch(e) {
  history = [];
}

// -------- CHAT UI --------

function add(text, who) {
  const d = document.createElement("div");
  d.className = "m " + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function showHistory() {
  chat.innerHTML = "";

  history.forEach(m => {
    add(m.text, m.role === "user" ? "me" : "ada");
  });

  if (!history.length) {
    add("Namaste! Main ADA hoon. Aaj aap kya karna chahte hain?", "ada");
  }
}

showHistory();

// -------- VOICE OUTPUT --------

let voices = [];

function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  voices = speechSynthesis.getVoices();
}

if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice() {
  const hindi = voices.filter(v =>
    v.lang.toLowerCase().startsWith("hi")
  );

  return hindi.find(v => /female|google/i.test(v.name)) ||
    hindi[0] ||
    voices.find(v => v.lang.toLowerCase().startsWith("en-in")) ||
    null;
}

function speak(text) {
  if (!speakOn || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const clean = text
    .replace(/\[REMEMBER:.*?\]/g, "")
    .replace(/[*#_`]/g, "")
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "");

  const u = new SpeechSynthesisUtterance(clean);
  const v = pickVoice();

  u.lang = v ? v.lang : "hi-IN";
  if (v) u.voice = v;

  u.pitch = 1.1;
  u.rate = 1;

  u.onstart = () => {
    statusEl.textContent = "ADA bol rahi hai...";
  };

  u.onend = () => {
    if (!busy && !listening) statusEl.textContent = "Ready";
  };

  speechSynthesis.speak(u);
}

// -------- VOICE INPUT --------

const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let rec = null;

if (SR) {
  rec = new SR();
  rec.lang = "hi-IN";
  rec.interimResults = false;
  rec.continuous = false;

  rec.onresult = e => {
    const t = e.results[0][0].transcript;
    stopMic();
    sendMsg(t);
  };

  rec.onerror = e => {
    stopMic();
    statusEl.textContent = "Mic error: " + e.error;
  };

  rec.onend = () => {
    listening = false;
    $("mic").classList.remove("on");
  };
}

function startMic() {
  if (!rec) {
    alert("Voice input ke liye Chrome browser try karein.");
    return;
  }

  if (busy) return;

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  try {
    rec.start();
    listening = true;
    $("mic").classList.add("on");
    statusEl.textContent = "Sun rahi hoon...";
  } catch(e) {
    statusEl.textContent = "Mic start nahi hua. Dobara try karein.";
  }
}

function stopMic() {
  listening = false;
  $("mic").classList.remove("on");
  if (!busy) statusEl.textContent = "Ready";
}

$("mic").onclick = () => {
  if (listening) {
    rec.stop();
    stopMic();
  } else {
    startMic();
  }
};

// -------- GEMINI AI BRAIN (retry + timeout + fallback) --------

async function callModel(model, body) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);

  try {
    const url =
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

    const response = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": getKey()
      },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });

    let data = {};
    try { data = await response.json(); } catch(e) {}

    return { ok: response.ok, status: response.status, data };
  } finally {
    clearTimeout(timer);
  }
}

async function ask() {
  const mem = getMem();

  const system =
    PERSONALITY +
    (mem ? "\nUser memory:\n" + mem : "");

  const body = {
    systemInstruction: {
      parts: [{text: system}]
    },
    contents: history.slice(-20).map(m => ({
      role: m.role,
      parts: [{text: m.text}]
    })),
    generationConfig: {
      temperature: 0.8,
      maxOutputTokens: 700
    }
  };

  let lastErr = "";

  for (let attempt = 0; attempt < MAX_TRIES; attempt++) {
    const model = MODELS[attempt % MODELS.length];

    statusEl.textContent = attempt === 0
      ? "ADA soch rahi hai..."
      : "Dobara koshish (" + (attempt + 1) + "/" + MAX_TRIES + ")...";

    try {
      const { ok, status, data } = await callModel(model, body);

      if (ok) {
        const parts = data.candidates?.[0]?.content?.parts || [];
        const answer = parts.map(p => p.text || "").join("").trim();

        if (answer) return answer;

        lastErr = "AI ne text reply nahi diya. Safety block ya empty response ho sakta hai.";
      } else {
        const message = data.error?.message || "Unknown API error";
        lastErr = "Gemini API Error (" + status + "): " + message;

        if (!RETRY_STATUS.includes(status)) {
          throw new Error(lastErr);
        }
      }
    } catch(e) {
      if (e.name === "AbortError") {
        lastErr = "Timeout: 30 second mein jawab nahi aaya.";
      } else if (String(e.message).startsWith("Gemini API Error")) {
        throw e;
      } else {
        lastErr = "Network error: " + String(e.message || e);
      }
    }

    if (attempt < MAX_TRIES - 1) {
      await sleep(1500 * (attempt + 1));
    }
  }

  throw new Error(lastErr || "Jawab nahi aaya.");
}

// -------- SEND MESSAGE --------

async function sendMsg(text) {
  text = (text || "").trim();

  if (!text || busy) return;

  if (!getKey()) {
    $("setup").style.display = "flex";
    statusEl.textContent = "API Key required";
    return;
  }

  inp.value = "";
  add(text, "me");

  history.push({
    role: "user",
    text: text
  });

  busy = true;
  $("send").disabled = true;
  $("mic").disabled = true;
  statusEl.textContent = "ADA soch rahi hai...";

  try {
    let reply = await ask();

    // Extract memory
    const re = /\[REMEMBER:\s*(.*?)\]/g;
    const facts = [...reply.matchAll(re)]
      .map(m => m[1].trim())
      .filter(Boolean);

    if (facts.length) {
      const oldMem = getMem();
      const updated = [...new Set(
        (oldMem + "\n" + facts.join("\n"))
          .split("\n")
          .map(x => x.trim())
          .filter(Boolean)
      )];

      localStorage.setItem(
        "ada_mem",
        updated.slice(-50).join("\n")
      );
    }

    reply = reply.replace(re, "").trim();

    history.push({
      role: "model",
      text: reply
    });

    history = history.slice(-40);
    saveHistory();

    add(reply, "ada");
    speak(reply);

  } catch(e) {
    const msg = String(e.message || e);

    add("ADA Error:\n" + msg, "ada");

    console.error(e);

    // Remove failed user message from history
    history.pop();
    saveHistory();

    if (msg.includes("400")) {
      statusEl.textContent = "Request error";
    } else if (msg.includes(
